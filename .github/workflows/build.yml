name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: unzip -q DailyAyah.zip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - run: bash DailyAyah/fetch_photos.sh
      - run: gradle assembleDebug
        working-directory: DailyAyah
      - uses: actions/upload-artifact@v7
        with:
          name: DailyAyah-apk
          path: DailyAyah/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp DailyAyah/app/build/outputs/apk/debug/app-debug.apk DailyAyah.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DailyAyah.apk --title "Daily Ayah (latest)" --notes "Tap DailyAyah.apk below to download and install."
