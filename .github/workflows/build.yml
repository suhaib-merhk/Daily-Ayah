name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: unzip -q DailyAyah.zip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - run: bash DailyAyah/fetch_photos.sh
      - run: gradle assembleDebug
        working-directory: DailyAyah
      - uses: actions/upload-artifact@v7
        with:
          name: DailyAyah-apk
          path: DailyAyah/app/build/outputs/apk/debug/*.apk
